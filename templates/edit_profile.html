{% extends "base.html" %}

{% block header %}
    <h1>Edit Profile</h1><br><br>
{% endblock %}

{% block content %}
    <div class="profile-container">
    <!-- Logout & Back -->
        <a href="{{ url_for('photos.dashboard') }}" class="back-button">Back</a>
    <a href="{{ url_for('auth.logout') }}" class="profile-button">Logout</a>
    </div><br><br>

    <!-- Update form -->
    <form method="POST" action="{{ url_for('user.update_user') }}">
        <div class="container">
            <label for="username" class="form-label">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ user.username }}">

            <label for="email" class="form-label">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ user.email }}">

            <label for="password" class="form-label">New Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Leave blank to keep current password">
        </div>

        <div class="button-container-1">
            <button type="submit" class="button">Update Profile</button>
        </div>
        <div class="button-container-1">
            <a href="{{ url_for('photos.dashboard') }}" class="button">Cancel</a>
        </div>
    </form><br><br>

<div class="container">
<!-- Delete account form -->
    <h3>Delete Account</h3>
    </div>
<div class="container">
    <p>Warning: This action cannot be undone.</p>
</div>
<div class="container">
    <form method="POST" action="{{ url_for('user.delete_user') }}"
          onsubmit="return confirm('Are you sure you want to delete your account? This action cannot be undone.');">
        <button type="submit" class="delete-button">Delete My Account</button>
    </form>
</div>
{% endblock %}
